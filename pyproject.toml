[project]
name = "finagent"
version = "0.1.0"
description = "A股财报点评 Agent"
requires-python = ">=3.11"
dependencies = [
    "langchain>=0.3",
    "langchain-deepseek>=0.1",
    "langgraph>=0.2",
    "akshare>=1.14",
    "requests>=2.28",
    "rich>=13.0",
    "python-dotenv>=1.0",
    "textual>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["finagent"]
